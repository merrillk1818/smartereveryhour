# Trust Cloudflare IP ranges for real visitor IP
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    server_name smartereveryhour.com www.smartereveryhour.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://smartereveryhour.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.smartereveryhour.com;

    ssl_certificate     /etc/letsencrypt/live/smartereveryhour.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartereveryhour.com/privkey.pem;

    return 301 https://smartereveryhour.com$request_uri;
}

server {
    listen 443 ssl;
    server_name smartereveryhour.com;

    ssl_certificate     /etc/letsencrypt/live/smartereveryhour.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartereveryhour.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/smartereveryhour/public;
    index index.php;

    client_max_body_size 5M;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Public landing page — served by the Next.js "landing" container.
    # Only the exact "/" path and its "/_next/*" build assets go here;
    # every other path (login, dashboard, API, learn sessions, static
    # files below) still falls through to Laravel/static root untouched.
    location = / {
        proxy_pass http://landing:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_next/ {
        proxy_pass http://landing:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /sw.js {
        add_header Service-Worker-Allowed "/";
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass seh-laravel:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60;
    }

    location ~ /\.(?!well-known) { deny all; }
}
